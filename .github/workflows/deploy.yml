name: 自动部署到飞牛OS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: 部署到飞牛OS
        uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FNOS_HOST }}  # 确保是公网IP
          username: SUP  # 改成你的管理员用户名
          password: ${{ secrets.SSH_PASSWORD }}  # ← 新增：使用密码认证
          port: 22
          timeout: 60s
          command_timeout: 20m
          script: |
            cd /vol1/docker/myapp
            sudo ./deploy.sh
