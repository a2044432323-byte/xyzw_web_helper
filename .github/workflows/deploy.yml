name: 自动部署到飞牛OS

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: appleboy/ssh-action@master
        with:
          host: ${{ secrets.FNOS_HOST }}
          username: SUP  # ← 改成你的管理员用户名
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: cd /vol1/docker/myapp && sudo ./deploy.sh
