name: 自动同步上游仓库

on:
  schedule:
    - cron: '0 */3 * * *'  # UTC时间每3小时
  
  workflow_dispatch:  # 允许手动运行

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: 检出目标分支
        uses: actions/checkout@v4
        with:
          ref: main  # 改成你的分支名（main或master）
          token: ${{ secrets.GITHUB_TOKEN }}
      
      - name: 同步上游仓库
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          # 必填：上游仓库（格式：用户名/项目名）
          upstream_sync_repo: w1249178256/xyzw_web_helper  # ← 改成你的！
          
          # 必填：上游分支
          upstream_sync_branch: main  # ← 不确定就去原仓库看看
            
          # 必填：你的分支
          target_sync_branch: main    # ← 通常和上面一样
            
          # 推荐：冲突处理策略
          git_config_pull_rebase: false
            
          # 可选：如果历史记录不同，允许合并
          upstream_pull_args: '--allow-unrelated-histories --depth=100'
            
          # 可选：测试模式（设为true时不会真的推送）
          test_mode: false
