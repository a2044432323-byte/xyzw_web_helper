name: 自动同步上游仓库

on:
  # 定时触发：每6小时检查一次（UTC时间）
  schedule:
    - cron: '0 */6 * * *'
  
  # 手动触发：在Actions页面点击按钮即可运行
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      # 步骤1：检出你的Fork仓库
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
      
      # 步骤2：同步上游仓库
      - name: 同步上游仓库
        uses: aormsby/Fork-Sync-With-Upstream-action@v3.4
        with:
          # 上游仓库地址（改成原仓库的！）
           upstream_sync_repo: w1249178256/xyzw_web_helper
          
          # 上游分支（通常是main或master）
          upstream_sync_branch: main
          
          # 你的分支（通常是main）
          target_sync_branch: main
          
          # 如果冲突，强制用上游代码覆盖
          git_config_pull_rebase: false  # 冲突时用上游代码覆盖
          upstream_pull_args: '--allow-unrelated-histories'  # 允许不同历史记录
